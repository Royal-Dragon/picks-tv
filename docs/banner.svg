<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="TMDB titles are filtered to the streaming apps installed on your TV and shown as a row of posters">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2a3340"/></pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8a33d" stop-opacity="0"/><stop offset=".5" stop-color="#e8a33d" stop-opacity=".16"/><stop offset="1" stop-color="#e8a33d" stop-opacity="0"/></linearGradient>
    <g id="poster">
      <rect width="104" height="156" rx="10" fill="#1a212b" stroke="#303a48" stroke-width="2"/>
      <rect x="12" y="116" width="62" height="6" rx="3" fill="#303a48"/><rect x="12" y="128" width="40" height="6" rx="3" fill="#303a48"/>
    </g>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .lbl { font-size: 13px; letter-spacing: 3px; fill: #7d8896; }
    .ttl { font-size: 14px; font-weight: 700; fill: #f6ecd9; }
    .trace { fill: none; stroke: #e8a33d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1280" height="400" fill="#0d1117"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect y="120" width="1280" height="160" fill="url(#glow)"/>

  <!-- LEFT: everything TMDB says is popular -->
  <g opacity=".9">
    <use href="#poster" transform="translate(70 90) rotate(-8 52 78)" opacity=".5"/>
    <use href="#poster" transform="translate(170 70) rotate(5 52 78)" opacity=".6"/>
    <use href="#poster" transform="translate(120 190) rotate(-3 52 78)" opacity=".75"/>
    <use href="#poster" transform="translate(240 170) rotate(9 52 78)" opacity=".9"/>
  </g>
  <text x="70" y="368" class="mono lbl">TMDB</text>

  <!-- MIDDLE: the filter -->
  <path class="trace" d="M380 200 H560"/>
  <path class="trace" d="M548 188 l14 12 -14 12"/>
  <rect x="580" y="140" width="190" height="120" rx="14" fill="#161c26" stroke="#e8a33d" stroke-width="2"/>
  <text x="675" y="188" text-anchor="middle" class="mono ttl">your region</text>
  <text x="675" y="214" text-anchor="middle" class="mono ttl">+ your apps</text>
  <text x="675" y="240" text-anchor="middle" class="mono" font-size="12" fill="#7d8896">Netflix · JioHotstar</text>
  <path class="trace" d="M790 200 H920"/>
  <path class="trace" d="M908 188 l14 12 -14 12"/>

  <!-- RIGHT: the shelf of posters -->
  <g>
    <use href="#poster" transform="translate(950 120)" opacity=".7"/>
    <use href="#poster" transform="translate(1062 108) scale(1.08)"/>
    <use href="#poster" transform="translate(1186 120)" opacity=".7"/>
  </g>
  <text x="950" y="368" class="mono lbl">PICKS</text>
</svg>
